<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Bocina - Novedades el León</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #FBBF24 0%, #F97316 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        #pantalla-carga {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .telon-arriba {
            transform: translateY(-100%);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Tipografía SF Pro para la firma */
        .sf-pro {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>

<body class="min-h-screen font-sans text-black m-0 overflow-hidden" id="body-container">

    <!-- Efecto de Sonido (Aplausos para el telón) -->
    <audio id="audio-aplausos" src="https://actions.google.com/sounds/v1/crowds/light_applause.ogg"
        preload="auto"></audio>

    <!-- PANTALLA DE CARGA (TELÓN) -->
    <div id="pantalla-carga">
        <h1
            class="text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-10 text-center tracking-widest uppercase px-4 drop-shadow-lg">
            Bienvenidos a la<br>Rifa de Don León
        </h1>
        <button id="btn-comenzar"
            class="px-8 py-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-extrabold text-xl rounded-full shadow-[0_0_30px_rgba(251,191,36,0.6)] hover:scale-105 transition-transform animate-pulse">
            Quitar Telón para Comenzar
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="p-6 pb-10">
        <header class="text-center mt-6 mb-8 w-full max-w-2xl mx-auto">
            <h1 class="text-5xl font-extrabold text-black mb-2 uppercase tracking-wide drop-shadow-md">Novedades el León
            </h1>
            <p class="text-xl font-semibold text-black/80">Gran Rifa de Bocina</p>

            <!-- CONTADOR REGRESIVO -->
            <div class="mt-6 flex justify-center gap-3 text-center">
                <div
                    class="bg-black text-yellow-400 rounded-xl p-3 min-w-[4.5rem] shadow-lg border border-yellow-500/30">
                    <span id="cd-dias" class="text-3xl font-black block">00</span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-white/80">Días</span>
                </div>
                <div class="text-3xl font-black text-black pt-2">:</div>
                <div
                    class="bg-black text-yellow-400 rounded-xl p-3 min-w-[4.5rem] shadow-lg border border-yellow-500/30">
                    <span id="cd-horas" class="text-3xl font-black block">00</span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-white/80">Hrs</span>
                </div>
                <div class="text-3xl font-black text-black pt-2">:</div>
                <div
                    class="bg-black text-yellow-400 rounded-xl p-3 min-w-[4.5rem] shadow-lg border border-yellow-500/30">
                    <span id="cd-min" class="text-3xl font-black block">00</span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-white/80">Min</span>
                </div>
                <div class="text-3xl font-black text-black pt-2">:</div>
                <div
                    class="bg-black text-yellow-400 rounded-xl p-3 min-w-[4.5rem] shadow-lg border border-yellow-500/30">
                    <span id="cd-seg" class="text-3xl font-black block">00</span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-white/80">Seg</span>
                </div>
            </div>
            <p class="text-sm font-bold text-black/70 mt-3 uppercase tracking-wider">Para el gran sorteo (6 Nov 2026)
            </p>
        </header>

        <main class="w-full max-w-3xl mx-auto">
            <div class="bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-2xl shadow-2xl border border-orange-300 mb-10">
                <h2
                    class="text-2xl font-bold mb-6 text-black border-b border-orange-200 pb-4 flex justify-between items-center">
                    <div class="flex items-center">
                        Participantes
                        <!-- Contador en tiempo real de clientes -->
                        <span id="contador-participantes"
                            class="ml-3 text-sm font-black text-orange-800 bg-orange-200 px-3 py-1 rounded-lg shadow-inner">
                            0
                        </span>
                    </div>
                </h2>

                <div id="lista-participantes" class="space-y-4">
                    <!-- Se llena automáticamente -->
                </div>
            </div>

            <!-- FIRMA JASSOS ESTUDIOS (Minimalista SF Pro con Link a Instagram) -->
            <footer class="mt-16 text-center">
                <a href="https://www.instagram.com/jassosestudioss?cplk=MW9vYmtheTJxamdsZg%3D%3D" target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block sf-pro text-black/40 hover:text-orange-900 text-[11px] font-semibold uppercase tracking-[0.25em] transition-colors duration-300 cursor-pointer">
                    Jassos Estudios
                </a>
            </footer>
        </main>
    </div>

    <script>
        // ====================================================================
        // 🛠️ ZONA DE EDICIÓN MANUAL: AGREGA A TUS CLIENTES AQUÍ
        // Esta lista debe ser igual a la del panel de administración
        // ====================================================================
        const clientes = [
             { nombre: "Oscar Rodriguez", telefono: "639-167-4076", compra: 340 },
            { nombre: "Adriana Rivera", telefono: "639-119-0979", compra: 150 }
        ];

        // ====================================================================
        // ⏱️ LÓGICA DEL CONTADOR (6 DE NOVIEMBRE 2026)
        // ====================================================================
        const fechaSorteo = new Date("November 6, 2026 18:00:00").getTime();

        const actualizarContador = setInterval(function () {
            const ahora = new Date().getTime();
            const distancia = fechaSorteo - ahora;

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            document.getElementById("cd-dias").innerText = dias.toString().padStart(2, '0');
            document.getElementById("cd-horas").innerText = horas.toString().padStart(2, '0');
            document.getElementById("cd-min").innerText = minutos.toString().padStart(2, '0');
            document.getElementById("cd-seg").innerText = segundos.toString().padStart(2, '0');

            if (distancia < 0) {
                clearInterval(actualizarContador);
                document.getElementById("cd-dias").innerText = "00";
                document.getElementById("cd-horas").innerText = "00";
                document.getElementById("cd-min").innerText = "00";
                document.getElementById("cd-seg").innerText = "00";
            }
        }, 1000);

        // ====================================================================
        // ⚙️ LÓGICA DE INTERFAZ Y CLIENTES (Versión Pública)
        // ====================================================================

        function determinarSiEsMujer(nombreCompleto) {
            const primerNombre = nombreCompleto.trim().split(' ')[0].toLowerCase();
            const excepcionesMujer = ['carmen', 'isabel', 'beatriz', 'ruth', 'judith', 'guadalupe', 'rosario', 'inés', 'ines', 'abigail', 'raquel', 'esther', 'flor', 'luz'];
            const excepcionesHombre = ['jose', 'josé', 'luca', 'andrea', 'josua'];

            if (excepcionesHombre.includes(primerNombre)) return false;
            if (excepcionesMujer.includes(primerNombre)) return true;
            return primerNombre.endsWith('a');
        }

        const getSiluetaHombre = (clases) => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="${clases}">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>`;

        const getSiluetaMujer = (clases) => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="${clases}">
                <path d="M12 2C9.24 2 7 4.24 7 7c0 1.25.46 2.4 1.22 3.28C6.91 11.66 6 13.68 6 16v5h12v-5c0-2.32-.91-4.34-2.22-5.72C16.54 9.4 17 8.25 17 7c0-2.76-2.24-5-5-5zm0 1.5c1.93 0 3.5 1.57 3.5 3.5 0 .9-.35 1.72-.92 2.33C13.88 8.65 13 8 12 8s-1.88.65-2.58 1.33c-.57-.61-.92-1.43-.92-2.33 0-1.93 1.57-3.5 3.5-3.5zm-4.5 12.5c0-1.65 1.05-3.08 2.54-3.66C10.65 13 11.3 13.5 12 13.5s1.35-.5 1.96-1.16c1.49.58 2.54 2.01 2.54 3.66V19.5h-9v-3z"/>
            </svg>`;

        const contenedor = document.getElementById('lista-participantes');

        function renderizarClientes() {
            contenedor.innerHTML = '';

            // Actualizar cantidad de clientes en tiempo real
            document.getElementById('contador-participantes').innerText = `${clientes.length} Participantes`;

            clientes.forEach((cliente, index) => {
                // Sigue calculando los boletos solo para saber de qué color pintar la tarjeta
                const boletos = Math.floor(cliente.compra / 150);
                const alcanzoMeta = boletos > 0;
                const esMujer = determinarSiEsMujer(cliente.nombre);
                const iconoAsignado = esMujer ? getSiluetaMujer("w-6 h-6") : getSiluetaHombre("w-6 h-6");

                const div = document.createElement('div');
                div.className = `animate-fade-in p-4 rounded-xl border flex items-center transition-all shadow-sm ${alcanzoMeta ? 'bg-orange-50 border-orange-300' : 'bg-gray-100 border-gray-300 opacity-90'}`;
                div.style.animationDelay = `${(index * 0.15) + 0.3}s`;

                // Aquí SE OCULTAN todos los datos sensibles, solo se muestra nombre e icono
                const htmlContent = `
                    <div class="h-12 w-12 min-w-[3rem] rounded-full flex items-center justify-center font-black shadow-inner mr-4
                        ${alcanzoMeta ? 'bg-gradient-to-br from-yellow-400 to-orange-500 text-black border border-orange-600' : 'bg-gray-300 text-gray-700'}">
                        ${iconoAsignado}
                    </div>
                    <div>
                        <p class="font-extrabold text-xl text-black">${cliente.nombre}</p>
                        ${alcanzoMeta
                        ? `<p class="text-xs font-bold text-orange-600 uppercase tracking-wider mt-0.5">Participando en la rifa</p>`
                        : `<p class="text-xs font-bold text-gray-500 uppercase tracking-wider mt-0.5">Meta en progreso</p>`
                    }
                    </div>
                `;

                div.innerHTML = htmlContent;
                contenedor.appendChild(div);
            });
        }

        // ====================================================================
        // EVENTO DEL TELÓN INICIAL
        // ====================================================================
        document.getElementById('btn-comenzar').addEventListener('click', function () {
            const audio = document.getElementById('audio-aplausos');
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Audio bloqueado", e));

            const pantallaCarga = document.getElementById('pantalla-carga');
            pantallaCarga.classList.add('telon-arriba');
            document.getElementById('body-container').classList.remove('overflow-hidden');

            renderizarClientes();

            setTimeout(() => {
                pantallaCarga.remove();
            }, 1200);
        });

    </script>
</body>

</html>
